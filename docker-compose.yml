services:
  db:
    image: postgres:16
    container_name: campusmeetup_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusmeetup
      POSTGRES_PASSWORD: campusmeetup
      POSTGRES_DB: campusmeetup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
